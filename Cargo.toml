[package]
categories = ["command-line-utilities"]
description = "Starter template for CLI applications"
documentation = "https://docs.rs/cli-app-template"
edition = "2024"
homepage = "https://github.com/tobx/rust-cli-app-template"
license = "MIT"
license-file = "LICENSE"
name = "cli-app-template"
readme = "README.md"
repository = "https://github.com/tobx/rust-cli-app-template"
version = "0.3.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.26"
directories = "6.0.0"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
